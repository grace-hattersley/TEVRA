url: https://grace-hattersley.github.io/TEVRA/

home:
  title: "TEVRA: single-cell BCR/TCR repertoire analysis in R"
  description: "TEVRA is an R package that maps V(D)J immune repertoire features (clonal diversity, CDR3 convergence, SHM) onto transcriptional aggregates defined from single-cell RNA-seq data."

template:
  bootstrap: 5
  math-rendering: mathjax
  includes:
    in_header: |
      <meta name="google-site-verification" content="beqXSJEkp_aLSuEtVXUXSOl5SMJ7aluG8zy9vBYmLBc" />
  opengraph:
    image:
      src: man/figures/TEVRA_preview.png
      alt: "TEVRA: mapping immune repertoire features onto single-cell aggregates"
  twitter:
    creator: "@ColinYCLee"
    card: summary_large_image

navbar:
  components:
    intro:
      text: Vignette
      href: articles/TEVRA.html

reference:
- title: Neighbourhood construction
  desc: Define transcriptional neighbourhoods and choose a clustering resolution.
  contents:
  - test_resolution
  - plot_resolution_results
  - create_communities
  - plot_nhood_sizes
  - nhood_umap
- title: Neighbourhood annotation
  desc: Assign cell type labels and composition to each neighbourhood.
  contents:
  - nhood_annotation
  - nhood_annotation_props
- title: Repertoire metrics
  desc: Compute receptor repertoire features for each neighbourhood.
  contents:
  - nhood_diversity
  - nhood_shm
  - nhood_cdr3_convergence
  - nhood_cdr3_convergence_matrices
  - merge_nhood_results
- title: Visualisation
  desc: Plot neighbourhood-level results.
  contents:
  - plot_nhood_umap
  - plot_nhood_beeswarm
  - plot_nhood_scatter
  - plot_capture_efficiency
- title: Example data
  contents: tevra_example